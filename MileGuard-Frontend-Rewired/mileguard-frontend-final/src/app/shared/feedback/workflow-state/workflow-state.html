<main class="flex min-h-[calc(100vh-64px)] items-center justify-center px-5 py-16"><section class="w-full max-w-xl rounded-[1.75rem] border border-[var(--mg-border-light)] bg-white p-8 text-center shadow-[var(--mg-shadow-sm)] sm:p-12"><div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-[var(--mg-green-950)] text-2xl text-[var(--mg-orange-500)]">MG</div><p class="mt-7 text-[10px] font-bold uppercase tracking-[0.18em] text-[var(--mg-orange-600)]">{{ eyebrow }}</p><h1 class="mt-3 text-3xl font-semibold tracking-[-0.04em] text-[var(--mg-green-950)]">{{ title }}</h1><p class="mx-auto mt-4 max-w-md text-sm leading-6 text-[var(--mg-text-secondary)]">{{ message }}</p><button type="button" (click)="retry()" class="mt-8 rounded-xl bg-[var(--mg-green-950)] px-5 py-3 text-sm font-bold text-white">Return</button></section></main>
